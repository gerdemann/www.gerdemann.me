server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    return 301 https://www.gerdemann.me$request_uri;
}

server {
    listen 80;
    server_name www.gerdemann.me localhost 127.0.0.1;
    server_tokens off;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; frame-src https://giscus.gerdemann.me; script-src 'self' https://giscus.gerdemann.me; script-src-attr 'none'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self'; manifest-src 'self'; form-action 'self'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "0" always;

    client_body_temp_path /tmp/nginx;
    client_max_body_size 64M;

    include /etc/nginx/snippets/legacy-redirects.conf;

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location = /.well-known/pki-validation/fileauth.txt {
        allow all;
        log_not_found off;
        access_log off;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(?:jpg|jpeg|gif|png|ico|swf|svg|eot|ttf|otf|woff|woff2|css|js)$ {
        access_log off;
        expires max;
    }

    error_page 404 /404.html;
    error_page 500 502 503 504 /5xx.html;

    gzip on;
    gzip_disable "msie6";

    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/x-javascript text/xml application/xml application/xml+rss text/javascript application/javascript;
}
