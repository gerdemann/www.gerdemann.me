<article class="post-row">
  <a class="post-row-link" href="{{ .RelPermalink }}">
    <div class="post-date"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "02.01.2006" }}</time><span>{{ if eq .Params.articleLanguage "de" }}DE{{ else }}EN{{ end }}</span></div>
    <div class="post-row-copy"><h3 lang="{{ .Params.articleLanguage | default "en" }}">{{ .Title }}</h3><p lang="{{ .Params.articleLanguage | default "en" }}">{{ .Summary | plainify | htmlUnescape | truncate 160 }}</p></div>
    <span class="post-row-arrow" aria-hidden="true">↗</span>
  </a>
</article>
