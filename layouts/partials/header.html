<header class="site-header">
<div class="shell header-inner">
<a class="wordmark" href="{{ "/" | relURL }}" aria-label="Michael Gerdemann – Startseite"><span class="monogram" aria-hidden="true">{{ partial "brand-mark.html" . }}</span><span>Michael Gerdemann</span></a>
<div class="header-controls">
<button class="theme-toggle" type="button" aria-label="Dunkelmodus aktivieren" aria-pressed="false" hidden><svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7Z"/></svg><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg></button>
<button class="menu-toggle" type="button" aria-expanded="false" aria-controls="hauptnavigation" hidden>Menü <span aria-hidden="true">☰</span></button>
</div>
<nav id="hauptnavigation" aria-label="Hauptnavigation">
<a href="{{ "/#projekte" | relURL }}">Projekte</a>
<a href="{{ "/about.html" | relURL }}" {{ if eq .RelPermalink "/about.html" }}aria-current="page"{{ end }}>Über mich</a>
<a href="{{ "/blog.html" | relURL }}" {{ if or (eq .RelPermalink "/blog.html") (eq .Section "posts") }}aria-current="page"{{ end }}>Blog</a>
<a class="nav-contact" href="{{ "/#kontakt" | relURL }}">Kontakt <span aria-hidden="true">↗</span></a>
</nav>
</div>
</header>
