baseURL = 'https://www.gerdemann.me/'
title = 'Michael Gerdemann'
locale = 'de-DE'
defaultContentLanguage = 'de'
uglyURLs = true
timeZone = 'Europe/Berlin'
enableRobotsTXT = true

[params]
  author = 'Michael Gerdemann'
  siteDesc = 'Michael Gerdemann – CTO bei VARIOS AI und Anwendungsentwickler. KI-Plattformen, Apps und Open Source.'
  localPreview = false

[outputFormats.RSS]
  mediaType = 'application/rss+xml'
  baseName = 'feed'

[outputs]
  home = ['HTML', 'RSS']
  page = ['HTML']
  section = ['HTML']
  taxonomy = ['HTML']
  term = ['HTML', 'RSS']

[markup.goldmark.renderer]
  unsafe = true
[markup.highlight]
  noClasses = false
